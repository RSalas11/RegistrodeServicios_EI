<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Servicios</title>
  <link rel="stylesheet" href="Registro.css">
</head>
<header class="Maarspa">
  <h1> Ma'arSpa</h1>
</header>
<body>
  <div class="contenedor-principal">
    <h1>Registro de Servicios</h1>

    <form id="formularioServicio">
      <div class="grupo-formulario">
        <label for="nombreCliente">Nombre del Cliente</label>
        <input type="text" id="nombreCliente" required>  
      </div>

      <div class="grupo-formulario">
        <label for="tipoServicio">Tipo de Servicio</label>
        <select id="tipoServicio" required>
          <option value="">Seleccione un servicio</option>
          <option value="Drenaje Linfático">Drenaje Linfático</option>
          <option value="Faciales Especializados">Faciales Especializados</option>
          <option value="Peptonas">Peptonas</option>
          <option value="Masajes Especializados">Masajes Especializados</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label for="fechaServicio">Fecha</label>
        <input type="text" id="fechaServicio" placeholder="DD/MM/AAAA" required>
      </div>

      <div class="grupo-formulario">
        <label for="costoServicio">Costo ($)</label>
        <input type="number" id="costoServicio" min="0" step="0.01" required>
      </div>

      <div class="grupo-formulario">
        <label for="notasServicio">Notas Adicionales</label>
        <textarea id="notasServicio" rows="3"></textarea>
      </div>

      <button type="submit">Registrar Servicio</button>
    </form>

    <div class="lista-servicios">
      <h2>Servicios Registrados</h2>
      <div id="contenedorServicios"></div>
    </div>
  </div>

  <script src="Registro.js"></script>
</body>
</html>
